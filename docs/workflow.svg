<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>PaMs Dance Studio — AI Video Generation Workflow</title>
  <desc>Flowchart showing the end-to-end pipeline: wallet connect, NFT gate, vibe selection, WaveSpeed generation, FFmpeg stitching, lyric compositing, and final GCS upload.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- ── LANE BACKGROUNDS ── -->
  <rect x="10" y="10" width="760" height="90" rx="10" fill="#1e1b4b" opacity="0.18"/>
  <text x="24" y="30" font-size="10" fill="#818cf8" font-weight="600" letter-spacing="1">WALLET &amp; NFT AUTH</text>

  <rect x="10" y="112" width="760" height="90" rx="10" fill="#064e3b" opacity="0.18"/>
  <text x="24" y="132" font-size="10" fill="#34d399" font-weight="600" letter-spacing="1">USER SELECTION</text>

  <rect x="10" y="214" width="760" height="140" rx="10" fill="#431407" opacity="0.20"/>
  <text x="24" y="234" font-size="10" fill="#fb923c" font-weight="600" letter-spacing="1">AI VIDEO GENERATION  —  WaveSpeed Seedance 2.0</text>

  <rect x="10" y="366" width="760" height="140" rx="10" fill="#1a1244" opacity="0.18"/>
  <text x="24" y="386" font-size="10" fill="#a78bfa" font-weight="600" letter-spacing="1">VIDEO PIPELINE  —  FFmpeg + Shotstack</text>

  <rect x="10" y="518" width="760" height="90" rx="10" fill="#0c2340" opacity="0.22"/>
  <text x="24" y="538" font-size="10" fill="#38bdf8" font-weight="600" letter-spacing="1">DELIVERY</text>

  <!-- ══ ROW 1 — AUTH ══ -->

  <rect x="40" y="40" width="140" height="48" rx="8" fill="#4f46e5"/>
  <text x="110" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🦊 Connect Wallet</text>
  <text x="110" y="77" text-anchor="middle" font-size="10" fill="#c7d2fe">MetaMask / WalletConnect</text>

  <line x1="180" y1="64" x2="224" y2="64" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="250,40 310,64 250,88 190,64" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" transform="translate(15,0)"/>
  <text x="265" y="61" text-anchor="middle" font-size="10" font-weight="700" fill="#e0e7ff">PaMs NFT</text>
  <text x="265" y="75" text-anchor="middle" font-size="10" font-weight="700" fill="#e0e7ff">holder?</text>

  <line x1="325" y1="50" x2="378" y2="50" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="350" y="44" text-anchor="middle" font-size="9" fill="#f87171">No</text>
  <rect x="380" y="32" width="110" height="36" rx="8" fill="#7f1d1d"/>
  <text x="435" y="55" text-anchor="middle" font-size="11" fill="#fca5a5">🔒 Access Denied</text>

  <line x1="325" y1="64" x2="526" y2="64" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="430" y="58" text-anchor="middle" font-size="9" fill="#4ade80">Yes</text>
  <rect x="528" y="40" width="200" height="48" rx="8" fill="#14532d"/>
  <text x="628" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🖼️ Fetch NFT Gallery</text>
  <text x="628" y="77" text-anchor="middle" font-size="10" fill="#86efac">IPFS metadata + on-chain balanceOf</text>

  <!-- ══ ROW 2 — SELECTION ══ -->

  <line x1="628" y1="88" x2="628" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="156" x2="460" y2="156" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="290" y="134" width="170" height="48" rx="8" fill="#065f46"/>
  <text x="375" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🎵 Pick Vibe + Track</text>
  <text x="375" y="171" text-anchor="middle" font-size="10" fill="#6ee7b7">12 vibes · curated library</text>
  <line x1="460" y1="156" x2="462" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══ ROW 3 — GENERATION ══ -->

  <line x1="375" y1="182" x2="375" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="250" width="230" height="48" rx="8" fill="#7c2d12"/>
  <text x="375" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">📤 POST /pams-studio/generate</text>
  <text x="375" y="286" text-anchor="middle" font-size="10" fill="#fdba74">JWT auth · rate-limited</text>

  <line x1="490" y1="274" x2="544" y2="274" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <rect x="546" y="250" width="200" height="48" rx="8" fill="#9a3412"/>
  <text x="646" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🤖 WaveSpeed API</text>
  <text x="646" y="286" text-anchor="middle" font-size="10" fill="#fdba74">image-to-video · async submit</text>

  <path d="M 646 298 Q 646 338 600 338 Q 554 338 554 298" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
  <text x="600" y="332" text-anchor="middle" font-size="9" fill="#fb923c">polling every 5s (10 min timeout)</text>

  <line x1="546" y1="274" x2="330" y2="274" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="260" y1="274" x2="162" y2="274" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="40" y="250" width="120" height="48" rx="8" fill="#7c2d12"/>
  <text x="100" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">💾 Save Scene</text>
  <text x="100" y="285" text-anchor="middle" font-size="10" fill="#fdba74">PamsScene → GCS</text>
  <text x="200" y="269" text-anchor="middle" font-size="9" fill="#4ade80">✓ done</text>

  <!-- ══ ROW 4 — STITCH ══ -->

  <line x1="100" y1="298" x2="100" y2="402" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="404" width="165" height="48" rx="8" fill="#1e1244"/>
  <text x="122" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">✂️ POST /pams-studio/stitch</text>
  <text x="122" y="440" text-anchor="middle" font-size="10" fill="#c4b5fd">FFmpeg: intro + scene + outro</text>

  <line x1="205" y1="428" x2="264" y2="428" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <polygon points="290,404 350,428 290,452 230,428" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2" transform="translate(10,0)"/>
  <text x="300" y="425" text-anchor="middle" font-size="10" font-weight="700" fill="#e0e7ff">Lyrics</text>
  <text x="300" y="439" text-anchor="middle" font-size="10" font-weight="700" fill="#e0e7ff">enabled?</text>

  <line x1="360" y1="428" x2="420" y2="428" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="390" y="422" text-anchor="middle" font-size="9" fill="#a78bfa">Yes</text>
  <rect x="422" y="404" width="180" height="48" rx="8" fill="#312e81"/>
  <text x="512" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">📝 Lyric Overlays</text>
  <text x="512" y="440" text-anchor="middle" font-size="10" fill="#c4b5fd">Shotstack compositing · GCS</text>

  <line x1="300" y1="452" x2="300" y2="490" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="310" y="476" font-size="9" fill="#a78bfa">No</text>

  <line x1="512" y1="452" x2="512" y2="490" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="490" x2="512" y2="490" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="406" y1="490" x2="406" y2="508" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══ ROW 5 — DELIVERY ══ -->

  <rect x="280" y="540" width="165" height="48" rx="8" fill="#0c3a6e"/>
  <text x="362" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">☁️ Upload to GCS</text>
  <text x="362" y="576" text-anchor="middle" font-size="10" fill="#7dd3fc">PamsFinalVideo record created</text>

  <line x1="445" y1="564" x2="504" y2="564" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="506" y="540" width="155" height="48" rx="8" fill="#155e75"/>
  <text x="583" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🎉 Share &amp; Download</text>
  <text x="583" y="576" text-anchor="middle" font-size="10" fill="#7dd3fc">MP4 · presigned URL</text>
</svg>
